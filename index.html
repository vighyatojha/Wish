<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- resizes-content: when the Android keyboard opens, the page shrinks
         instead of hiding the answer box behind the keyboard -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./favicon.svg" />
    <title>Happy Birthday</title>
    <!-- the card WhatsApp (and other apps) show when the link is shared: a wrapped gift, nothing from inside -->
    <meta name="description" content="A little surprise, made just for you. Turn your sound on, and tap to open." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="For Varsha 🎂" />
    <meta property="og:description" content="A little surprise, made just for you. Turn your sound on, and tap to open." />
    <meta property="og:image" content="https://vighyatojha.github.io/Wish/og.jpg" />
    <meta property="og:image:secure_url" content="https://vighyatojha.github.io/Wish/og.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="A wrapped pink gift with a gold bow under a soft night sky, and the words: For Varsha, a little surprise made just for you" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="For Varsha 🎂" />
    <meta name="twitter:description" content="A little surprise, made just for you." />
    <meta name="twitter:image" content="https://vighyatojha.github.io/Wish/og.jpg" />
  </head>
  <body>
    <div id="root"><p class="boot">One moment…</p></div>
    <!-- shown only until the site's code has arrived (it replaces this); on a slow connection that can take a few seconds -->
    <style>
      .boot { position: fixed; inset: 0; display: grid; place-items: center; margin: 0; background: #fff;
              font: italic 18px/1.5 Georgia, 'Times New Roman', serif; color: #5f6679; animation: boot-in 0.8s 0.6s both; }
      @keyframes boot-in { from { opacity: 0; } }
    </style>
    <noscript><p style="padding:40px 28px;font:18px Georgia,serif">This birthday page needs JavaScript turned on.</p></noscript>
    <script type="module" src="/src/main.tsx"></script>
    <!-- If this source page is opened through a plain web server (not
         "npm run dev"), the app can't start. (The built site doesn't load
         /src/main.tsx, so there this does nothing.)
         • On the published site this page can be served for a minute while an
           update is going out: say "updating", keep checking, and switch to the
           real site the moment it's there.
         • Opened from a folder on a computer: say how to open it properly. -->
    <script>
      setTimeout(function () {
        if (window.__appStarted || !document.querySelector('script[src="/src/main.tsx"]')) return;
        var root = document.getElementById('root');
        var local = /^(localhost|127\.|0\.0\.0\.0|\[::1\]|192\.168\.|10\.)/.test(location.hostname) || location.protocol === 'file:';
        if (!local) {
          root.innerHTML = '<p class="boot">The page is updating… one moment.</p>';
          var check = function () {
            fetch(location.pathname + '?check=' + Date.now(), { cache: 'no-store' })
              .then(function (r) { return r.text(); })
              .then(function (t) {
                if (t.indexOf('src="/src/main.tsx"') < 0) {
                  var q = location.search ? location.search + '&' : '?';
                  location.replace(location.pathname + q + 'v=' + Date.now() + location.hash);
                } else setTimeout(check, 4000);
              })
              .catch(function () { setTimeout(check, 6000); });
          };
          check();
          return;
        }
        root.innerHTML =
          '<div style="max-width:34rem;margin:12vh auto;padding:0 28px;font:18px/1.55 Georgia,serif;color:#1c2333">' +
          '<p style="font-size:1.4rem;margin-bottom:1rem">This is the source folder, not the finished site.</p>' +
          '<p style="margin-bottom:1rem">Open the <b>dist</b> folder instead, for example <code>…/birthday-site/dist/</code> on the same server.</p>' +
          '<p>Or, in this folder, run <code>npm run dev</code> and open the address it prints.</p></div>';
      }, 2500);
    </script>
  </body>
</html>
