# Builds the site and publishes it to GitHub Pages on every push to main.
# One-time setup: repository Settings → Pages → Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Safety net: while Pages is set to "Deploy from a branch", GitHub also
      # publishes the raw source folder on every push. Wait until that publish
      # (for this same commit) has finished, so the finished site is always
      # published last. (Up to 6 minutes; harmless once the source is
      # "GitHub Actions", when there's no such publish to wait for.)
      - name: Wait for GitHub's own branch publish to finish
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          sleep 20
          for i in $(seq 1 36); do
            state=$(gh run list -R "$REPO" --commit "$SHA" --json name,status \
              -q '[.[] | select(.name == "pages build and deployment")] | if length == 0 then "none" else (map(.status) | if all(. == "completed") then "done" else "running" end) end')
            echo "branch publish: $state"
            if [ "$state" = "done" ]; then sleep 5; exit 0; fi
            if [ "$state" = "none" ] && [ "$i" -ge 3 ]; then exit 0; fi
            sleep 10
          done
      - id: deployment
        uses: actions/deploy-pages@v4
